# Server config
server {
    listen       80;
    # Only the public folder is served: the program, settings and data are outside the web root.
    root /data/htdocs/public;
    index  index.php;
    disable_symlinks off;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok\n';
    }

    # Everything that is not a file goes to the front controller
    location / {
      try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_param SCRIPT_FILENAME $document_root/index.php;
      fastcgi_param HTTP_AUTHORIZATION $http_authorization;
      fastcgi_read_timeout 600;
      include fastcgi_params;
    }

    # No other PHP file is executed
    location ~ \.php$ {
      return 404;
    }

    # Deny access to dot-files
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }
  }
