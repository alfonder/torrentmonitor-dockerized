name: Check/Update TorrentMonitor version

on:
  schedule:
    - cron: '0 * * * *'

jobs:
  update_torrentmonitor:
    name: Check/Update TorrentMonitor version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Obtain torrentmonitor version
        id: downloadtorrentmonitor
        shell: bash
        run: |
          # the latest published release of TorrentMonitor
          wget -q https://api.github.com/repos/azinchen/TorrentMonitor/releases/latest -O /tmp/release.json

          TM_VERSION=$(jq -r '.tag_name // empty' /tmp/release.json | sed 's/^[vV]//')
          TM_DATE=$(date -d "$(jq -r '.published_at' /tmp/release.json)" +%d.%m.%Y)
          [ -n "${TM_VERSION}" ] || { echo "no release found"; exit 1; }

          sed -i "s/\(ARG TM_VERSION=*\)[^ ]*/\1\"${TM_VERSION}\"/" Dockerfile
          sed -i "s/\(ENV TM_VERSION=*\)[^ ]*/\1\"${TM_VERSION}\"/" Dockerfile
          sed -i "s/\(    TM_RELEASE_DATE=*\)[^ ]*/\1\"${TM_DATE}\"/" Dockerfile

          PR_BRANCH="tmupdatebot/torrentmonitorupdate-${TM_VERSION}"

          echo "tm_version=${TM_VERSION}" >> $GITHUB_ENV
          echo "tm_date=${TM_DATE}" >> $GITHUB_ENV
          echo "pr_branch=${PR_BRANCH}" >> $GITHUB_ENV

          echo "Base pr_branch=${PR_BRANCH}, date=${TM_DATE}, tm_version=${TM_VERSION}"

      - name: Create Pull Request, Bump tm-latest.zip, torrentmonitor version ${{ env.tm_version }}
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ env.pr_branch }}
          commit-message: TM -> ${{ env.tm_version }}
          delete-branch: true
          title: Bump TM to version ${{ env.tm_version }}
          body: |
            Bump tm-latest.zip, version ${{ env.tm_version }}, date ${{ env.tm_date }}

            - Auto-generated by [create-pull-request](https://github.com/peter-evans/create-pull-request)
          labels: |
            dependencies
            github_actions
            release

      - name: Trigger notify workflow for created PR
        if: ${{ steps.create_pr.outputs.pull-request-number }}
        run: gh workflow run notify.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
